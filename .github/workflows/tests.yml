name: Tests

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The tests use the test profile with an in-memory H2 database.
      - run: mvn -B test
