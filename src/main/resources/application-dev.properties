# Development profile
# Local PostgreSQL (for example: docker run -e POSTGRES_PASSWORD=password -p 5432:5432 postgres:17)
spring.datasource.url=jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:hostera}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# App port
server.port=${PORT:8080}

# HTTP security toggle (dev environment)
app.security.enabled=${SECURITY_ENABLED:false}
