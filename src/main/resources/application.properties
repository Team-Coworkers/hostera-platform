# Spring Application Name
spring.application.name=Hostera Platform

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.teamcoworkers.hostera.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties (the prod profile reads the secret from JWT_SECRET)
authorization.jwt.secret=${JWT_SECRET:LocalDevelopmentSecretForHosteraPlatformTokensOnly2026}
authorization.jwt.expiration.days=7

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Concurrency & Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# Trusted frontend origins (comma-separated)
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://team-coworkers.github.io,https://team-coworkers-hostera-web.onrender.com}

# Demonstration data loaded on an empty database
app.seed.enabled=${SEED_ENABLED:true}

# ======================================
# SECURITY CONFIGURATION
# ======================================
# false = Disable authentication and authorization
# true  = Enable Spring Security and JWT
app.security.enabled=true
